name: jp_travel_app
description: 일본여행객을 위한 메뉴판 카메라 번역 앱
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0                # OCR/번역 API 호출
  image_picker: ^1.0.7        # 카메라 촬영 / 사진 선택
  file_picker: ^8.0.0         # 파일 선택
  flutter_dotenv: ^5.1.0      # API 키를 .env로 관리 (코드에 하드코딩 금지)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
